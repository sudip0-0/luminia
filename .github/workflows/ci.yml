name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lumina:lumina@localhost:5432/lumina
      AUTH_ALLOW_TEST_SECRET: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Audit (high+)
        run: npm audit --audit-level=high
      - name: Build API for migrate CLI
        run: npm run build --workspace @lumina/shared && npm run build --workspace @lumina/api
      - name: Apply migrations
        run: npm run migrate --workspace @lumina/api
