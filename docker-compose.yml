# Lumina local stack: Postgres (pgvector), Redis, Typesense, API, Jobs
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "xyz", "--enable-cors"]
    environment:
      TYPESENSE_DATA_DIR: /data
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      DATABASE_URL: postgres://lumina:lumina@postgres:5432/lumina
      REDIS_URL: redis://redis:6379
      AUTH_ACCESS_TOKEN_SECRET: local-dev-access-token-secret-min-32-chars
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: xyz
      PORT: "3000"
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started

  jobs:
    build:
      context: .
      dockerfile: packages/jobs/Dockerfile
    environment:
      DATABASE_URL: postgres://lumina:lumina@postgres:5432/lumina
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  typesense_data:
